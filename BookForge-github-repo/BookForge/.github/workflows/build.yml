name: Build BookForge for Windows

on:
  push:
    tags: ["v*"]        # pushing a tag like v1.2 builds everything and attaches it to a Release
  workflow_dispatch:     # also lets you click "Run workflow" on the Actions tab

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: pip install reportlab pypdf beautifulsoup4 pillow python-docx pyphen fonttools

      # PyInstaller's stock launcher is shared by thousands of programs (including
      # some malware), which is the main cause of antivirus false alarms. Compiling
      # our own launcher gives BookForge a unique one. Falls back to the stock one
      # if the compile ever fails, so the build never breaks.
      - name: Install PyInstaller with a freshly compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) { pip install pyinstaller }

      - name: Build folder version (recommended download - fewest antivirus alarms)
        run: pyinstaller --noconfirm --onedir --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib BookForge.py

      - name: Check the fonts and their licences are inside the program
        run: |
          $f = "dist/BookForge/_internal/fonts"
          if (-not (Test-Path $f)) { throw "The fonts folder is missing from the build. Check that fonts/ is in the repository and that the pyinstaller line above has --add-data fonts;fonts" }
          $ttf = (Get-ChildItem $f -Recurse -Filter *.ttf).Count
          $ofl = (Get-ChildItem $f -Recurse -Filter OFL.txt).Count
          Write-Host "Inside the program: $ttf font files and $ofl licence files"
          if ($ttf -lt 50 -or $ofl -lt 14) { throw "Some fonts or licences are missing from the build" }

      - name: Zip the folder version
        run: Compress-Archive -Path dist/BookForge -DestinationPath BookForge-Windows.zip

      - name: Build single-file version
        run: pyinstaller --noconfirm --onefile --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib --distpath dist_onefile --workpath build_onefile BookForge.py

      - name: Keep the files as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BookForge
          path: |
            BookForge-Windows.zip
            dist_onefile/BookForge.exe

      - name: Attach the files to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BookForge-Windows.zip
            dist_onefile/BookForge.exe
