name: Build BookForge for Windows

on:
  push:
    tags: ["v*"]          # pushing a version tag (e.g. v1.5.0) builds it and publishes that Release
  workflow_dispatch:       # "Run workflow" builds and keeps the downloads as artifacts; no Release is changed

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the project files and fonts are in the repository
        run: |
          foreach ($f in @("BookForge.py", "bf_build.py", "bf_core.py", "bf_edit.py", "bf_export.py", "bf_fonts.py", "bf_impose.py", "bf_pdf.py", "bf_theme.py", "bookforge.ico", "version_info.txt", "requirements.txt")) {
            if (-not (Test-Path $f -PathType Leaf)) { throw "Missing from the repository: $f" }
          }
          if (-not (Test-Path fonts)) { throw "There is no 'fonts' folder next to BookForge.py." }
          $ttf = (Get-ChildItem fonts -Recurse -Filter *.ttf).Count
          $ofl = (Get-ChildItem fonts -Recurse -Filter OFL.txt).Count
          Write-Host "In the repository: $ttf font files and $ofl licence files (expected 76 and 14)"
          if ($ttf -lt 76 -or $ofl -lt 14) { throw "Some font files or licences are missing from the repository." }

      - name: Check the version number matches the tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          $tag = "${{ github.ref_name }}".TrimStart("v")
          $ver = (Select-String -Path bf_core.py -Pattern '^APP_VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          Write-Host "Tag: $tag    BookForge version in bf_core.py: $ver"
          if ($tag -ne $ver) { throw "The tag ($tag) doesn't match APP_VERSION in bf_core.py ($ver). Update the version or use the matching tag." }

      - name: Install libraries
        run: pip install reportlab pypdf beautifulsoup4 pillow python-docx pyphen fonttools pypdfium2 pdfplumber

      - name: Run the tests (the ones needing private test books skip themselves)
        env:
          PYTHONUTF8: "1"
        run: |
          foreach ($t in Get-ChildItem tests -Filter test_*.py | Sort-Object Name) {
            Write-Host "== $($t.Name)"
            python $t.FullName
            if ($LASTEXITCODE -ne 0) { throw "Test failed: $($t.Name)" }
          }

      # PyInstaller's stock launcher is shared by thousands of programs (including
      # some malware), which is the main cause of antivirus false alarms. Compiling
      # our own launcher gives BookForge a unique one. Falls back to the stock one
      # if the compile ever fails, so the build never breaks.
      - name: Install PyInstaller with a freshly compiled bootloader
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) { pip install pyinstaller }

      - name: Build folder version (recommended download - fewest antivirus alarms)
        run: pyinstaller --onedir --noconfirm --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --add-data "fonts;fonts" --version-file version_info.txt --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib --collect-all pypdfium2 --collect-all pypdfium2_raw BookForge.py

      - name: Check the fonts, licences and preview engine are inside the program
        run: |
          $f = "dist/BookForge/_internal/fonts"
          if (-not (Test-Path $f)) { throw "The fonts folder is missing from the build." }
          $ttf = (Get-ChildItem $f -Recurse -Filter *.ttf).Count
          $ofl = (Get-ChildItem $f -Recurse -Filter OFL.txt).Count
          Write-Host "Inside the program: $ttf font files and $ofl licence files"
          if ($ttf -lt 76 -or $ofl -lt 14) { throw "Some fonts or licences are missing from the built program." }
          if (-not (Test-Path "dist/BookForge/_internal/pypdfium2_raw/pdfium.dll")) { throw "The preview engine (pdfium.dll) is missing from the build." }

      - name: Zip the folder version
        run: Compress-Archive -Path dist/BookForge -DestinationPath BookForge-Windows.zip

      - name: Build single-file version
        run: pyinstaller --onefile --noconfirm --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --add-data "fonts;fonts" --version-file version_info.txt --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib --collect-all pypdfium2 --collect-all pypdfium2_raw --distpath dist_onefile --workpath build_onefile BookForge.py

      - name: Keep the files as downloadable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BookForge
          path: |
            BookForge-Windows.zip
            dist_onefile/BookForge.exe

      - name: Attach the files to the Release for this tag
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            BookForge-Windows.zip
            dist_onefile/BookForge.exe
