name: Build BookForge for Windows

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to build and attach the Windows files to (for example, v1.4.3)"
        required: true
        default: "v1.4.3"
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: BookForge-github-repo/BookForge

    steps:
      - name: Check out the selected release source
        uses: actions/checkout@v5
        with:
          # Manual runs build the selected release tag; tag pushes build that tag directly.
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check the fonts are in the repository
        shell: pwsh
        run: |
          if (-not (Test-Path "fonts" -PathType Container)) {
            throw "There is no 'fonts' folder next to BookForge.py. Make sure the fonts folder and its 14 family folders are included in the selected release tag."
          }

          $ttf = @(Get-ChildItem "fonts" -Recurse -File -Filter "*.ttf").Count
          $ofl = @(Get-ChildItem "fonts" -Recurse -File -Filter "OFL.txt").Count
          Write-Host "Font files: $ttf; OFL licenses: $ofl (expected at least 76 and 14)"

          if ($ttf -lt 76 -or $ofl -lt 14) {
            throw "Some font files or OFL licenses are missing from the selected release tag."
          }

      - name: Install libraries
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { throw "Failed to upgrade pip." }
          python -m pip install reportlab pypdf beautifulsoup4 pillow python-docx pyphen fonttools
          if ($LASTEXITCODE -ne 0) { throw "Failed to install application dependencies." }

      - name: Install PyInstaller with a freshly compiled bootloader
        shell: pwsh
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: |
          python -m pip install --no-binary pyinstaller pyinstaller
          if ($LASTEXITCODE -ne 0) {
            Write-Warning "Compiled bootloader installation failed; installing the standard PyInstaller package."
            python -m pip install pyinstaller
            if ($LASTEXITCODE -ne 0) { throw "PyInstaller installation failed." }
          }

      - name: Build folder version
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onedir --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib BookForge.py
          if ($LASTEXITCODE -ne 0) { throw "The folder build failed." }

      - name: Verify bundled fonts and licenses
        shell: pwsh
        run: |
          $fontPath = "dist/BookForge/_internal/fonts"
          if (-not (Test-Path $fontPath -PathType Container)) {
            $fontPath = "dist/BookForge/fonts"
          }
          if (-not (Test-Path $fontPath -PathType Container)) {
            throw "Bundled fonts were not found in the PyInstaller output."
          }

          $ttf = @(Get-ChildItem $fontPath -Recurse -File -Filter "*.ttf").Count
          $ofl = @(Get-ChildItem $fontPath -Recurse -File -Filter "OFL.txt").Count
          Write-Host "Bundled font files: $ttf; bundled OFL licenses: $ofl"
          if ($ttf -lt 76 -or $ofl -lt 14) {
            throw "The built application is missing font files or OFL licenses."
          }

      - name: Package folder version
        shell: pwsh
        run: |
          Compress-Archive -Path "dist/BookForge" -DestinationPath "BookForge-Windows.zip" -Force
          if (-not (Test-Path "BookForge-Windows.zip" -PathType Leaf)) {
            throw "The Windows ZIP archive was not created."
          }

      - name: Build single-file version
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib --distpath dist_onefile --workpath build_onefile BookForge.py
          if ($LASTEXITCODE -ne 0) { throw "The single-file build failed." }
          if (-not (Test-Path "dist_onefile/BookForge.exe" -PathType Leaf)) {
            throw "The single-file executable was not created."
          }

      - name: Keep files as downloadable workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BookForge-Windows
          if-no-files-found: error
          path: |
            BookForge-github-repo/BookForge/BookForge-Windows.zip
            BookForge-github-repo/BookForge/dist_onefile/BookForge.exe

      - name: Attach Windows downloads to the selected GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          files: |
            BookForge-github-repo/BookForge/BookForge-Windows.zip
            BookForge-github-repo/BookForge/dist_onefile/BookForge.exe
