```yaml
name: Build BookForge for Windows

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out BookForge
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          python -m pip install reportlab pypdf beautifulsoup4 pillow python-docx
          python -m pip install pyinstaller

      - name: Find BookForge files
        shell: powershell
        run: |
          Write-Host "Searching repository for BookForge.py..."

          $script = Get-ChildItem -Path $env:GITHUB_WORKSPACE -Filter "BookForge.py" -Recurse -File | Select-Object -First 1

          if (-not $script) {
              Write-Error "BookForge.py was not found anywhere in the repository."
              exit 1
          }

          $projectDir = $script.Directory.FullName

          Write-Host "BookForge.py found at:"
          Write-Host $script.FullName
          Write-Host ""
          Write-Host "Project directory:"
          Write-Host $projectDir

          $icon = Join-Path $projectDir "bookforge.ico"
          $version = Join-Path $projectDir "version_info.txt"

          if (-not (Test-Path $icon)) {
              Write-Error "bookforge.ico was not found next to BookForge.py."
              exit 1
          }

          if (-not (Test-Path $version)) {
              Write-Error "version_info.txt was not found next to BookForge.py."
              exit 1
          }

          "BOOKFORGE_SCRIPT=$($script.FullName)" >> $env:GITHUB_ENV
          "BOOKFORGE_DIR=$projectDir" >> $env:GITHUB_ENV
          "BOOKFORGE_ICON=$icon" >> $env:GITHUB_ENV
          "BOOKFORGE_VERSION=$version" >> $env:GITHUB_ENV

      - name: Build folder version
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onedir `
            --windowed `
            --name BookForge `
            --icon "$env:BOOKFORGE_ICON" `
            --add-data "$env:BOOKFORGE_ICON;." `
            --version-file "$env:BOOKFORGE_VERSION" `
            --collect-data docx `
            --collect-submodules reportlab.pdfbase `
            "$env:BOOKFORGE_SCRIPT"

      - name: Zip folder version
        shell: powershell
        run: |
          Compress-Archive `
            -Path "dist/BookForge" `
            -DestinationPath "BookForge-Windows.zip"

      - name: Build single-file version
        shell: powershell
        run: |
          python -m PyInstaller `
            --noconfirm `
            --clean `
            --onefile `
            --windowed `
            --name BookForge `
            --icon "$env:BOOKFORGE_ICON" `
            --add-data "$env:BOOKFORGE_ICON;." `
            --version-file "$env:BOOKFORGE_VERSION" `
            --collect-data docx `
            --collect-submodules reportlab.pdfbase `
            --distpath "dist_onefile" `
            --
