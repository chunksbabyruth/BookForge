name: Build BookForge for Windows

on:
push:
tags:
- "v1.4.3*"
workflow_dispatch:

permissions:
contents: write

jobs:
build:
runs-on: windows-latest

defaults:
  run:
    working-directory: BookForge-github-repo/BookForge

steps:
  - name: Check out repository
    uses: actions/checkout@v5

  - name: Set up Python
    uses: actions/setup-python@v6
    with:
      python-version: "3.12"

  - name: Verify project files and fonts
    shell: pwsh
    run: |
      $requiredFiles = @(
        "BookForge.py",
        "bookforge.ico",
        "version_info.txt"
      )

      foreach ($file in $requiredFiles) {
        if (-not (Test-Path $file -PathType Leaf)) {
          throw "Required file is missing: $file"
        }
      }

      if (-not (Test-Path "fonts" -PathType Container)) {
        $rootFonts = Join-Path $env:GITHUB_WORKSPACE "fonts"

        if (Test-Path $rootFonts -PathType Container) {
          Write-Host "Copying fonts from repository root into the project folder."
          Copy-Item $rootFonts "fonts" -Recurse
        }
        else {
          throw "The fonts folder is missing from both the project folder and repository root. Commit the fonts folder and all 14 font-family folders to GitHub."
        }
      }

      $fontFolders = @(Get-ChildItem "fonts" -Directory)
      $ttf = @(Get-ChildItem "fonts" -Recurse -File -Filter "*.ttf").Count
      $ofl = @(Get-ChildItem "fonts" -Recurse -File -Filter "OFL.txt").Count

      Write-Host "Font family folders: $($fontFolders.Count)"
      Write-Host "TTF files: $ttf"
      Write-Host "OFL licenses: $ofl"

      foreach ($folder in $fontFolders) {
        $count = @(Get-ChildItem $folder.FullName -Recurse -File -Filter "*.ttf").Count
        $license = Test-Path (Join-Path $folder.FullName "OFL.txt")
        Write-Host "$($folder.Name): $count TTF files; OFL license: $license"
      }

      if ($fontFolders.Count -lt 14 -or $ttf -lt 76 -or $ofl -lt 14) {
        throw "Font validation failed. Expected at least 14 font folders, 76 TTF files, and 14 OFL.txt licenses."
      }

  - name: Install application dependencies
    shell: pwsh
    run: |
      python -m pip install --upgrade pip
      python -m pip install reportlab pypdf beautifulsoup4 pillow python-docx pyphen fonttools

  - name: Install PyInstaller with compiled bootloader
    shell: pwsh
    env:
      PYINSTALLER_COMPILE_BOOTLOADER: "1"
    run: |
      python -m pip install --no-binary pyinstaller pyinstaller

      if ($LASTEXITCODE -ne 0) {
        Write-Warning "Compiled bootloader installation failed. Trying the standard PyInstaller package."
        python -m pip install pyinstaller
        if ($LASTEXITCODE -ne 0) {
          throw "PyInstaller installation failed."
        }
      }

  - name: Build folder version
    shell: pwsh
    run: |
      python -m PyInstaller --noconfirm --clean --onedir --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib BookForge.py

      if ($LASTEXITCODE -ne 0) {
        throw "The folder build failed."
      }

  - name: Verify bundled fonts and licenses
    shell: pwsh
    run: |
      $fontPath = "dist/BookForge/_internal/fonts"

      if (-not (Test-Path $fontPath -PathType Container)) {
        $fontPath = "dist/BookForge/fonts"
      }

      if (-not (Test-Path $fontPath -PathType Container)) {
        throw "Bundled fonts were not found in the PyInstaller output."
      }

      $ttf = @(Get-ChildItem $fontPath -Recurse -File -Filter "*.ttf").Count
      $ofl = @(Get-ChildItem $fontPath -Recurse -File -Filter "OFL.txt").Count

      Write-Host "Bundled TTF files: $ttf"
      Write-Host "Bundled OFL licenses: $ofl"

      if ($ttf -lt 76 -or $ofl -lt 14) {
        throw "The built application is missing font files or licenses."
      }

  - name: Package folder version
    shell: pwsh
    run: |
      Compress-Archive -Path "dist/BookForge" -DestinationPath "BookForge-Windows.zip" -Force

      if (-not (Test-Path "BookForge-Windows.zip")) {
        throw "The Windows ZIP archive was not created."
      }

  - name: Build single-file version
    shell: pwsh
    run: |
      python -m PyInstaller --noconfirm --clean --onefile --windowed --name BookForge --icon bookforge.ico --add-data "bookforge.ico;." --version-file version_info.txt --add-data "fonts;fonts" --collect-data docx --collect-data pyphen --collect-submodules reportlab.pdfbase --collect-submodules fontTools.ttLib.tables --collect-submodules fontTools.varLib --distpath dist_onefile --workpath build_onefile BookForge.py

      if ($LASTEXITCODE -ne 0) {
        throw "The single-file build failed."
      }

      if (-not (Test-Path "dist_onefile/BookForge.exe")) {
        throw "The single-file executable was not created."
      }

  - name: Upload Windows downloads
    uses: actions/upload-artifact@v4
    with:
      name: BookForge-Windows
      if-no-files-found: error
      path: |
        BookForge-github-repo/BookForge/BookForge-Windows.zip
        BookForge-github-repo/BookForge/dist_onefile/BookForge.exe

  - name: Attach downloads to GitHub Release
    if: startsWith(github.ref, 'refs/tags/')
    uses: softprops/action-gh-release@v2
    with:
      files: |
        BookForge-github-repo/BookForge/BookForge-Windows.zip
        BookForge-github-repo/BookForge/dist_onefile/BookForge.exe
